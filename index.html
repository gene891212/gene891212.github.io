<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>謝明 · 專案展示</title>
  <meta name="description" content="謝明 (gene891212) 的 GitHub Pages 專案展示。" />
  <link rel="icon" href="https://github.com/gene891212.png" />
  <style>
    :root {
      --bg: #fbfbfa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #57606a;
      --text-muted: #8c959f;
      --border: #e6e6e3;
      --border-hover: #c9c9c4;
      --accent: #2563eb;
      --radius: 14px;
      --maxw: 1080px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0c;
        --surface: #161615;
        --text: #f2f2f0;
        --text-secondary: #a8b1bb;
        --text-muted: #6e7681;
        --border: #262624;
        --border-hover: #3a3a37;
        --accent: #6ea8ff;
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---- header ---- */
    header {
      padding: 72px 0 40px;
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: block;
      margin: 0 auto 20px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }

    header p.bio {
      color: var(--text-secondary);
      margin: 0 0 20px;
      font-size: 16px;
    }

    .links {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      background: var(--surface);
      transition: border-color 0.15s, transform 0.15s;
    }

    .links a:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .links svg { width: 16px; height: 16px; }

    /* ---- toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 8px 0 28px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .search input:focus { border-color: var(--accent); }

    .count {
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    /* ---- grid ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      padding-bottom: 64px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
      word-break: break-word;
    }

    .card-title svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }

    .card-desc {
      flex-grow: 1;
      color: var(--text-secondary);
      font-size: 14px;
      margin: 0 0 18px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc.empty { color: var(--text-muted); font-style: italic; }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .meta-item { display: inline-flex; align-items: center; gap: 6px; }

    .lang-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .meta-item svg { width: 14px; height: 14px; }

    /* ---- states ---- */
    .state {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 0;
      font-size: 15px;
    }

    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      height: 150px;
    }

    .sk-line {
      height: 12px;
      border-radius: 6px;
      background: var(--border);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 0 0 48px;
    }

    footer a { color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" src="https://github.com/gene891212.png" alt="謝明" />
      <h1>謝明</h1>
      <div class="links">
        <a href="https://github.com/gene891212" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.74 10.34A6 6 0 1 0 10.34 11.74l3.2 3.2a1 1 0 0 0 1.42-1.42l-3.22-3.18ZM2 6.5a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Z"/></svg>
        <input id="search" type="text" placeholder="搜尋專案..." autocomplete="off" />
      </div>
      <span class="count" id="count"></span>
    </div>

    <div class="grid" id="grid"></div>

    <footer>
      自動同步自 <a href="https://github.com/gene891212?tab=repositories" target="_blank" rel="noopener">GitHub</a> · 只顯示已啟用 GitHub Pages 的專案
    </footer>
  </div>

  <script>
    const USER = "gene891212";
    const SELF_REPO = "gene891212.github.io";

    const langColors = {
      JavaScript: "#f1e05a", TypeScript: "#3178c6", Python: "#3572A5",
      HTML: "#e34c26", CSS: "#563d7c", Java: "#b07219", "C++": "#f34b7d",
      C: "#555555", "C#": "#178600", Go: "#00ADD8", Rust: "#dea584",
      Ruby: "#701516", PHP: "#4F5D95", Shell: "#89e051", Vue: "#41b883",
      Swift: "#F05138", Kotlin: "#A97BFF", Dart: "#00B4AB", Jupyter: "#DA5B0B",
      "Jupyter Notebook": "#DA5B0B", Svelte: "#ff3e00", Lua: "#000080",
    };

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");
    const countEl = document.getElementById("count");
    let repos = [];

    const icons = {
      repo: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.5 2.5 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.5 2.5 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.25.25 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>',
      star: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>',
      fork: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>',
      ext: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 2A1.75 1.75 0 0 0 2 3.75v8.5C2 13.216 2.784 14 3.75 14h8.5A1.75 1.75 0 0 0 14 12.25v-3.5a.75.75 0 0 0-1.5 0v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25v-8.5a.25.25 0 0 1 .25-.25h3.5a.75.75 0 0 0 0-1.5ZM9.75 2a.75.75 0 0 0 0 1.5h1.69L7.22 7.72a.75.75 0 1 0 1.06 1.06l4.22-4.22v1.69a.75.75 0 0 0 1.5 0V2Z"/></svg>',
    };

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function pagesUrl(repo) {
      if (repo.homepage && /^https?:\/\//.test(repo.homepage)) return repo.homepage;
      return `https://${USER}.github.io/${repo.name}/`;
    }

    function cardHtml(repo) {
      const desc = repo.description
        ? `<p class="card-desc">${esc(repo.description)}</p>`
        : `<p class="card-desc empty">尚無專案描述</p>`;
      const color = langColors[repo.language] || "var(--text-muted)";
      const lang = repo.language
        ? `<span class="meta-item"><span class="lang-dot" style="background:${color}"></span>${esc(repo.language)}</span>`
        : "";
      const fork = repo.forks_count
        ? `<span class="meta-item">${icons.fork}${repo.forks_count}</span>` : "";
      return `
        <a class="card" href="${pagesUrl(repo)}" target="_blank" rel="noopener">
          <h2 class="card-title">${icons.repo}${esc(repo.name)} ${icons.ext}</h2>
          ${desc}
          <div class="card-meta">
            ${lang}
            <span class="meta-item">${icons.star}${repo.stargazers_count}</span>
            ${fork}
          </div>
        </a>`;
    }

    function render(list) {
      if (!list.length) {
        grid.innerHTML = `<p class="state" style="grid-column:1/-1">找不到符合的專案。</p>`;
        countEl.textContent = "";
        return;
      }
      grid.innerHTML = list.map(cardHtml).join("");
      countEl.textContent = `${list.length} 個專案`;
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q
        ? repos.filter((r) =>
            r.name.toLowerCase().includes(q) ||
            (r.description || "").toLowerCase().includes(q) ||
            (r.language || "").toLowerCase().includes(q))
        : repos;
      render(filtered);
    }

    function showSkeletons() {
      grid.innerHTML = Array.from({ length: 6 }).map(() => `
        <div class="skeleton">
          <div class="sk-line" style="width:55%;margin-bottom:16px"></div>
          <div class="sk-line" style="width:90%;margin-bottom:10px"></div>
          <div class="sk-line" style="width:70%"></div>
        </div>`).join("");
    }

    async function load() {
      showSkeletons();
      try {
        const res = await fetch(
          `https://api.github.com/users/${USER}/repos?per_page=100&sort=updated`,
          { headers: { Accept: "application/vnd.github+json" } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        repos = data
          .filter((r) => r.has_pages && r.name !== SELF_REPO && !r.archived)
          .sort((a, b) => b.stargazers_count - a.stargazers_count ||
            new Date(b.pushed_at) - new Date(a.pushed_at));
        if (!repos.length) {
          grid.innerHTML = `<p class="state" style="grid-column:1/-1">目前沒有已啟用 GitHub Pages 的專案。</p>`;
          return;
        }
        applyFilter();
      } catch (err) {
        grid.innerHTML = `<p class="state" style="grid-column:1/-1">
          載入失敗：${esc(err.message)}<br />
          （GitHub API 每小時上限為 60 次，請稍後再試）
        </p>`;
      }
    }

    searchInput.addEventListener("input", applyFilter);
    load();
  </script>
</body>
</html>
